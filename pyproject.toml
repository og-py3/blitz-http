[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "blitz-http"
version = "1.0.0"
description = "High-performance async HTTP client that rivals Go net/http in raw throughput"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
    { name = "blitz contributors" }
]
keywords = ["http", "async", "client", "performance", "aiohttp", "httpx", "uvloop"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Framework :: AsyncIO",
]
dependencies = [
    "aiohttp>=3.9.0",
    "httpx[http2]>=0.27.0",
    "aiodns>=3.1.0",
    "psutil>=5.9.0",
    "brotli>=1.1.0",
    "h2>=4.1.0",
    "certifi>=2024.0.0",
]

[project.optional-dependencies]
uvloop = ["uvloop>=0.19.0"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
]

[project.urls]
Homepage = "https://github.com/yourusername/blitz"
Repository = "https://github.com/yourusername/blitz"
"Bug Tracker" = "https://github.com/yourusername/blitz/issues"

[tool.setuptools.packages.find]
include = ["blitz*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.coverage.run]
source = ["blitz"]
omit = ["tests/*"]
